services:
  sigongbot:
    build: .
    container_name: sigongbot-special-edition
    env_file:
      - .env
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - temp-data:/app/temp
      - database-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  temp-data:
  database-data:
