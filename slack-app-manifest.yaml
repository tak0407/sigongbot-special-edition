_metadata:
  major_version: 1

display_information:
  name: 시공봇
  description: 회고와 시간 기록을 공유하고 함께 돌아보는 Slack 봇
  background_color: "#2C2D30"

features:
  bot_user:
    display_name: 시공봇
    always_online: false
  slash_commands:
    - command: /공유
      description: 회고와 시간 기록을 공유합니다
      should_escape: false
    - command: /내회고
      description: 내가 작성한 회고를 확인합니다
      should_escape: false
    - command: /제안
      description: 시공봇 개선 제안을 제출합니다
      should_escape: false
    - command: /관리자
      description: 시공봇 관리자 메뉴를 엽니다
      should_escape: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:join
      - channels:read
      - channels:write.invites
      - chat:write
      - commands
      - files:read
      # 미제출 회고 리마인더의 1:1 DM 발송에 쓴다. 2026-09-21 21:00 발송 8건은 이
      # 스코프 없이도 나갔지만, 봇과 DM 이력이 없는 멤버까지 통하는지는 확인되지
      # 않았다. 라이브 앱에 설정돼 있으므로 이 줄을 지우고 적용하면 제거된다.
      - im:write
      # 관리자 대시보드에서 사용자 ID를 표시 이름으로 바꾸는 데 사용한다.
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - channel_created
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_hosted: false
